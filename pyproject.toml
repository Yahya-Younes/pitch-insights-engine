[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "frontend",
    "infra/snapshot",
    "tools/finetune_data",
    "C--Users-yyounes-*",
]

[tool.ruff.lint]
# Conservative on purpose: real-bug classes (syntax errors, pyflakes, bugbear),
# import ordering, and a few safe pyupgrade modernisations.
select = ["E9", "F", "I", "B", "UP"]
ignore = []

[tool.coverage.run]
source = ["agents", "service", "datagen", "eval"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
